<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Translator Offline</title>
    <style>
      :root {
        color: #e5ecff;
        background: #07111f;
        font-family: Inter, system-ui, sans-serif;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }
      main {
        width: min(520px, calc(100vw - 32px));
        border: 1px solid rgba(148, 163, 184, .28);
        border-radius: 18px;
        background: #0f172a;
        padding: 24px;
      }
      h1 {
        margin-top: 0;
      }
      a {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        justify-content: center;
        margin-top: 12px;
        padding: 0 18px;
        border-radius: 999px;
        background: #2563eb;
        color: white;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Translator is offline</h1>
      <p>The app shell is saved, but live translation needs the backend connection. Start the backend again, then reopen the app.</p>
      <a href="/">Retry</a>
    </main>
  </body>
</html>
