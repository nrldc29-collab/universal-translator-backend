<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#11140f" />
    <title>Install Live Translator</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 18px;
        font-family: system-ui, sans-serif;
        color: #f7f8f4;
        background: #11140f;
      }
      main {
        width: min(560px, 100%);
        display: grid;
        gap: 14px;
      }
      a {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        color: #081d1a;
        background: #2dd4bf;
        font-weight: 800;
        text-decoration: none;
      }
      p {
        color: #cbd5c6;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Install Live Translator</h1>
      <p>Open the app, then use your browser menu to choose Install app or Add to Home Screen.</p>
      <p>Android: Chrome menu, Add to Home screen. iPhone: Safari share button, Add to Home Screen.</p>
      <a href="/">Open Live Translator</a>
    </main>
  </body>
</html>
