[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ailang-integration"
version = "0.1.0"
description = "AILang integration for Universal Translator"
requires-python = ">=3.8"
dependencies = [
    "ailang>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ailang_integration*"]
