name: Railway post-deploy

on:
  deployment_status:
    states: [success]

jobs:
  finish:
    runs-on: ubuntu-latest
    if: >-
      github.event.deployment_status.state == 'success' &&
      contains(github.event.deployment.environment, 'production')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Generate public domain (requires RAILWAY_TOKEN secret)
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
          USERS: ${{ secrets.PRODUCTION_USERS }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Skip: add secrets.RAILWAY_TOKEN to auto-generate the public domain after deploy."
            exit 0
          fi
          export PATH="$HOME/.railway/bin:$PATH"
          python3 -m pip install websockets
          RUN_SMOKE=0 bash scripts/railway_public_setup.sh | tee railway-public-url.txt

      - name: Run production smoke
        env:
          SMOKE_REMOTE: "1"
          USERS: ${{ secrets.PRODUCTION_USERS }}
        run: |
          URL="${{ vars.PRODUCTION_URL }}"
          if [[ -z "$URL" && -f railway-public-url.txt ]]; then
            URL="$(grep -E '^Public URL:' railway-public-url.txt | sed 's/^Public URL: //')"
          fi
          if [[ -z "$URL" ]]; then
            echo "Set vars.PRODUCTION_URL or secrets.RAILWAY_TOKEN to finish public verification."
            exit 0
          fi
          if [[ -z "$USERS" ]]; then
            echo "Set secrets.PRODUCTION_USERS (e.g. demo:password) to run full EN↔HT smoke."
            exit 0
          fi
          python3 -m pip install websockets
          python3 scripts/smoke_local.py "$URL"
