name: Production smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed service URL (e.g. https://your-app.up.railway.app)
        required: true
        type: string

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install smoke client dependency
        run: python -m pip install websockets
      - name: Run EN↔HT production smoke
        run: python scripts/smoke_local.py "${{ inputs.base_url }}"
