name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy preflight
        run: bash scripts/preflight_deploy.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            models/tts
          key: models-v1-${{ runner.os }}-${{ hashFiles('scripts/setup_models.py', 'requirements.txt') }}
          restore-keys: |
            models-v1-${{ runner.os }}-
      - name: Fetch bundled Piper voices for offline smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          import scripts.setup_models as setup
          for name, url in setup.REQUIRED_PIPER_VOICE_URLS.items():
              setup.download_file(url, setup.TTS_DIR / name)
          PY
      - name: Offline smoke check
        run: python scripts/smoke_local.py
      - name: Run backend tests
        run: python -m pytest -q

  ai-comm-system:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ai-comm-system dependencies
        working-directory: research/ai-comm-system
        run: npm install
      - name: Run ai-comm-system tests
        working-directory: research/ai-comm-system
        run: npm test

  integration-live:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y espeak-ng ffmpeg
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            models/tts
          key: models-v1-${{ runner.os }}-${{ hashFiles('scripts/setup_models.py', 'requirements.txt') }}
          restore-keys: |
            models-v1-${{ runner.os }}-
      - name: Download and warm local models
        run: |
          for attempt in 1 2 3; do
            if python scripts/setup_models.py; then
              exit 0
            fi
            echo "setup_models attempt ${attempt} failed; waiting 90s before retry..."
            sleep 90
          done
          exit 1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Live bundled smoke check
        env:
          REQUESTS_PER_MINUTE: "120"
          QUOTA_REQUESTS_PER_HOUR: "500"
          MAX_ACTIVE_STREAMS_PER_USER: "5"
        run: |
          mkdir -p logs
          env -u ALLOWED_ORIGIN_REGEX SERVE_FRONTEND_DIST=1 BACKEND_PORT=8001 PARTIAL_TTS_MODE=1 python -m uvicorn backend.api:app --host 127.0.0.1 --port 8001 >logs/bundled-backend.log 2>&1 &
          echo $! >logs/bundled-backend.pid
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:8001/health >/dev/null 2>&1 && break
            sleep 2
          done
          python scripts/smoke_local.py http://127.0.0.1:8001
          kill $(cat logs/bundled-backend.pid) 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: translator-mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: translator-mobile
        run: npm ci
      - name: Lint mobile
        working-directory: translator-mobile
        run: npm run lint
      - name: Build mobile web export
        working-directory: translator-mobile
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Railway Docker image
        run: docker build -f Dockerfile -t anai-translator:ci .
      - name: Smoke test production container (Railway PORT=8080)
        run: |
          JWT=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          docker run -d --name anai-smoke -p 18080:8080 \
            -e ENVIRONMENT=production \
            -e PORT=8080 \
            -e JWT_SECRET="$JWT" \
            -e USERS=smoke:smokepass \
            -e ALLOWED_ORIGINS=http://127.0.0.1:18080 \
            anai-translator:ci
          ready=0
          for i in $(seq 1 120); do
            health="$(curl -sf http://127.0.0.1:18080/health || true)"
            if [ -n "$health" ] && printf '%s' "$health" | python -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('ready') else 1)"; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" -ne 1 ]; then
            echo "Container logs:"
            docker logs anai-smoke | tail -200
            docker rm -f anai-smoke
            exit 1
          fi
          python -m pip install websockets
          SMOKE_REMOTE=1 USERS=smoke:smokepass python scripts/smoke_local.py http://127.0.0.1:18080
          docker rm -f anai-smoke