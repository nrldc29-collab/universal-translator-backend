name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run backend tests
        run: pytest --ignore=tests/test_websocket_integration.py --ignore=tests/test_stt_integration.py -q

  ai-comm-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install ai-comm-system dependencies
        working-directory: ai-comm-system
        run: npm install
      - name: Run ai-comm-system tests
        working-directory: ai-comm-system
        run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: translator-mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: translator-mobile
        run: npm ci
      - name: Lint mobile
        working-directory: translator-mobile
        run: npm run lint
      - name: Build mobile web export
        working-directory: translator-mobile
        run: npm run build