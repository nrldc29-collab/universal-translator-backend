version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        /bin/ollama serve &
        sleep 5
        ollama pull ${OLLAMA_MODEL:-mistral}
        wait
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  stt_provider:
    build:
      context: ./stt_provider/server
      dockerfile: Dockerfile
    container_name: stt-provider
    ports:
      - "8002:8002"
    environment:
      - ENV=prod
      - STT_API_KEY=${STT_API_KEY}
      - STT_API_KEYS=translator:${STT_PROVIDER_API_KEY}
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - WHISPER_MODEL_SIZE=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
      - TRANSCRIPTION_LANGUAGE=en
      - MAX_ACTIVE_CONNECTIONS=10
      - MAX_CONNECTIONS_PER_KEY=3
      - PORT=8002
    volumes:
      - ./stt_provider/models:/app/models  # Cache downloaded Whisper models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: anai-translator-backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      - USE_GPU=1
      - WHISPER_DEVICE=cuda
      - WHISPER_COMPUTE_TYPE=float16
      - WHISPER_MODEL_SIZE=tiny
      - WHISPER_NUM_WORKERS=1
      - PRELOAD_MODELS=1
      - TRANSLATION_DEVICE=cuda
      - STT_MAX_CONCURRENCY=2
      - WHISPER_BEAM_SIZE=1
      - VAD_RECENT_CHUNKS=2
      - VAD_FORCE_FINAL_SECONDS=0.35
      - SPEECH_MERGE_MS=80
      - MIN_SPEECH_BYTES=4000
      - PARTIAL_STT_MIN_BYTES=4000
      - PARTIAL_STT_INTERVAL_MS=250
      - PIPELINE_STEP_TIMEOUT_SECONDS=10
      - TTS_CHUNK_CHARS=26
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - STT_PROVIDER=streaming
      - STT_PROVIDER_URL=http://stt_provider:8002
      - STT_PROVIDER_WS_URL=ws://stt_provider:8002/stt/stream
      - STT_PROVIDER_API_KEY=${STT_PROVIDER_API_KEY}
      # Ollama — local LLM for AILang intelligence layer
      - OLLAMA_ENABLED=${OLLAMA_ENABLED:-true}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-mistral}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-30}
      - USE_LLM_AGENTS=${USE_LLM_AGENTS:-true}
    volumes:
      - ./models:/app/models  # Cache downloaded models
    depends_on:
      ollama:
        condition: service_healthy
      stt_provider:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ollama_data:
