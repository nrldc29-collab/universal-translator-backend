<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>True Streaming STT Client</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 20px;
      }

      button {
        font-size: 16px;
        padding: 10px 14px;
        margin-right: 8px;
        cursor: pointer;
      }

      .box {
        border: 1px solid #ddd;
        border-radius: 10px;
        padding: 16px;
        margin-top: 18px;
        min-height: 80px;
        white-space: pre-wrap;
      }

      .label {
        font-weight: 700;
        margin-top: 24px;
      }
    </style>
  </head>
  <body>
    <h1>True Streaming STT Client</h1>

    <input id="serverUrl" type="text" value="" placeholder="WebSocket URL (blank = same origin)" style="font-size:16px;padding:10px;width:340px;margin-right:8px;" />
    <input id="apiKey" type="password" placeholder="API key" style="font-size:16px;padding:10px;width:280px;margin-right:8px;" />
    <button id="start">Start microphone</button>
    <button id="stop" disabled>Stop</button>

    <div class="label">Status</div>
    <div id="status" class="box">Idle</div>

    <div class="label">Partial transcript</div>
    <div id="partial" class="box"></div>

    <div class="label">Final transcript</div>
    <div id="final" class="box"></div>

    <script>
      let socket = null;
      let audioContext = null;
      let source = null;
      let processor = null;
      let stream = null;

      const statusEl = document.getElementById("status");
      const partialEl = document.getElementById("partial");
      const finalEl = document.getElementById("final");
      const startButton = document.getElementById("start");
      const stopButton = document.getElementById("stop");

      function setStatus(text) {
        statusEl.textContent = text;
      }

      function floatTo16BitPCM(float32Array) {
        const output = new Int16Array(float32Array.length);

        for (let i = 0; i < float32Array.length; i++) {
          const sample = Math.max(-1, Math.min(1, float32Array[i]));
          output[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
        }

        return output;
      }

      function downsampleBuffer(buffer, inputSampleRate, outputSampleRate) {
        if (outputSampleRate === inputSampleRate) {
          return buffer;
        }

        const sampleRateRatio = inputSampleRate / outputSampleRate;
        const newLength = Math.round(buffer.length / sampleRateRatio);
        const result = new Float32Array(newLength);

        let offsetResult = 0;
        let offsetBuffer = 0;

        while (offsetResult < result.length) {
          const nextOffsetBuffer = Math.round((offsetResult + 1) * sampleRateRatio);
          let accumulator = 0;
          let count = 0;

          for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
            accumulator += buffer[i];
            count++;
          }

          result[offsetResult] = accumulator / count;
          offsetResult++;
          offsetBuffer = nextOffsetBuffer;
        }

        return result;
      }

      async function start() {
        let serverUrl = document.getElementById("serverUrl").value.trim();

        if (!serverUrl) {
          const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
          serverUrl = `${protocol}//${window.location.host}/stt/stream`;
        }

        const apiKey = document.getElementById("apiKey").value.trim();
        const separator = serverUrl.includes("?") ? "&" : "?";
        const wsUrl = `${serverUrl}${separator}api_key=${encodeURIComponent(apiKey)}`;
        socket = new WebSocket(wsUrl);
        socket.binaryType = "arraybuffer";

        socket.onopen = async () => {
          setStatus("Connected. Asking for microphone permission...");

          stream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true
            }
          });

          audioContext = new AudioContext();
          source = audioContext.createMediaStreamSource(stream);
          processor = audioContext.createScriptProcessor(4096, 1, 1);

          processor.onaudioprocess = (event) => {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
              return;
            }

            const input = event.inputBuffer.getChannelData(0);
            const downsampled = downsampleBuffer(input, audioContext.sampleRate, 16000);
            const pcm16 = floatTo16BitPCM(downsampled);

            socket.send(pcm16.buffer);
          };

          source.connect(processor);
          processor.connect(audioContext.destination);

          startButton.disabled = true;
          stopButton.disabled = false;

          setStatus("Streaming microphone audio...");
        };

        socket.onmessage = (event) => {
          const data = JSON.parse(event.data);

          if (data.type === "session.started") {
            setStatus("STT session started");
          }

          if (data.type === "transcript.partial") {
            partialEl.textContent = data.text;
          }

          if (data.type === "transcript.final") {
            partialEl.textContent = "";
            finalEl.textContent += data.text + "\n";
          }

          if (data.type === "session.flushed") {
            setStatus("Flushed");
          }
        };

        socket.onerror = () => {
          setStatus("WebSocket error. Check the server URL and API key.");
        };

        socket.onclose = () => {
          setStatus("Disconnected");
        };
      }

      function stop() {
        if (socket && socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: "flush" }));
          socket.close();
        }

        if (processor) {
          processor.disconnect();
        }

        if (source) {
          source.disconnect();
        }

        if (audioContext) {
          audioContext.close();
        }

        if (stream) {
          stream.getTracks().forEach((track) => track.stop());
        }

        socket = null;
        audioContext = null;
        source = null;
        processor = null;
        stream = null;

        startButton.disabled = false;
        stopButton.disabled = true;

        setStatus("Stopped");
      }

      startButton.onclick = start;
      stopButton.onclick = stop;
    </script>
  </body>
</html>
