# Tempo Deployment for STT Platform
# Deploys Tempo for distributed tracing visualization

apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.2.2
          ports:
            - name: tempo
              containerPort: 3100
            - name: otlp-grpc
              containerPort: 4317
          args:
            - '-config.file=/etc/tempo/config.yaml'
          volumeMounts:
            - name: tempo-config
              mountPath: /etc/tempo
            - name: tempo-data
              mountPath: /tmp/tempo
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: tempo-config
          configMap:
            name: tempo-config
        - name: tempo-data
          persistentVolumeClaim:
            claimName: tempo-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: stt
spec:
  selector:
    app: tempo
  ports:
    - name: tempo
      port: 3100
      targetPort: 3100
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-pvc
  namespace: stt
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

# Apply with:
# kubectl apply -f infra/k8s/tempo-deployment.yaml
