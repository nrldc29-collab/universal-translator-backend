# Ingress Deployment for STT Platform
# Deploys Nginx Ingress Controller with TLS termination

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 1h
  url: https://kubernetes.github.io/ingress-nginx

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingress-nginx
  namespace: ingress-nginx
spec:
  interval: 1h
  chart:
    spec:
      chart: ingress-nginx
      version: '4.8.3'
      sourceRef:
        kind: HelmRepository
        name: ingress-nginx
        namespace: ingress-nginx
  values:
    controller:
      service:
        type: LoadBalancer
      metrics:
        enabled: true
        service:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "10254"

---
# Ingress for STT Gateway
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stt-gateway-ingress
  namespace: stt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/websocket-services: "stt-gateway"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - stt.example.com
      secretName: stt-gateway-tls
  rules:
    - host: stt.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stt-gateway
                port:
                  number: 80

# Apply with:
# kubectl apply -f infra/k8s/ingress-deployment.yaml
