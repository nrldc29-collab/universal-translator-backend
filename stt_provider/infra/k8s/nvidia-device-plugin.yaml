# NVIDIA Device Plugin for GPU Kubernetes
# Installs NVIDIA device plugin for GPU support

apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-config
  namespace: kube-system
data:
  config.yaml: |
    version: v1
    sharing:
      timeSlicing:
        renameBy: false
        failRequestsGreaterThan: 1
        resources:
          - name: nvidia.com/gpu
            replicas: 1

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.14.5
          args:
            - --config-file=/etc/nvidia-device-plugin/config.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/nvidia-device-plugin
      volumes:
        - name: config
          configMap:
            name: nvidia-device-plugin-config

# Apply with:
# kubectl apply -f infra/k8s/nvidia-device-plugin.yaml
