# Secrets Generator Script for STT Platform
# Generates secure secrets for production deployment

apiVersion: v1
kind: ConfigMap
metadata:
  name: secrets-generator
  namespace: stt
data:
  generate-secrets.sh: |
    #!/bin/bash
    set -euo pipefail

    # Generate secure secrets
    STT_API_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
    ADMIN_API_KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(48))")
    API_KEY_HASH_SECRET=$(python3 -c "import secrets; print(secrets.token_hex(32))")
    POSTGRES_PASSWORD=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
    GRAFANA_ADMIN_USER="admin"
    GRAFANA_ADMIN_PASSWORD=$(python3 -c "import secrets; print(secrets.token_urlsafe(16))")
    PAGERDUTY_KEY="replace-with-pagerduty-integration-key"

    # Create Kubernetes secret
    kubectl create secret generic stt-platform-secrets \
      --from-literal=ENV="production" \
      --from-literal=STT_API_KEY="$STT_API_KEY" \
      --from-literal=ADMIN_API_KEY="$ADMIN_API_KEY" \
      --from-literal=POSTGRES_USER="stt" \
      --from-literal=POSTGRES_PASSWORD="$POSTGRES_PASSWORD" \
      --from-literal=DATABASE_URL="postgresql://stt:$POSTGRES_PASSWORD@postgres.stt.svc.cluster.local:5432/stt" \
      --from-literal=REDIS_URL="redis://redis.stt.svc.cluster.local:6379/0" \
      --from-literal=TRITON_GRPC_URL="triton-parakeet.stt.svc.cluster.local:8001" \
      --from-literal=TRITON_ASR_MODEL="parakeet-tdt-streaming" \
      --from-literal=TRITON_DIARIZATION_MODEL="diar_streaming_sortformer_4spk-v2" \
      --from-literal=TRITON_REQUEST_TIMEOUT_MS="5000" \
      --from-literal=API_KEY_HASH_SECRET="$API_KEY_HASH_SECRET" \
      --from-literal=REQUIRE_TLS="true" \
      --from-literal=REQUIRE_MTLS="false" \
      --from-literal=MAX_SESSION_SECONDS="3600" \
      --from-literal=MAX_CONCURRENT_STREAMS_PER_TENANT="100" \
      --from-literal=TRANSCRIPTION_RATE_LIMIT_PER_MINUTE="30" \
      --from-literal=ADMIN_RATE_LIMIT_PER_MINUTE="5" \
      --from-literal=GRAFANA_ADMIN_USER="$GRAFANA_ADMIN_USER" \
      --from-literal=GRAFANA_ADMIN_PASSWORD="$GRAFANA_ADMIN_PASSWORD" \
      --namespace=stt \
      --dry-run=client -o yaml | kubectl apply -f -

    echo "Secrets generated and applied to stt-platform-secrets"
    echo "IMPORTANT: Save these secrets securely:"
    echo "STT_API_KEY: $STT_API_KEY"
    echo "ADMIN_API_KEY: $ADMIN_API_KEY"
    echo "POSTGRES_PASSWORD: $POSTGRES_PASSWORD"
    echo "GRAFANA_ADMIN_PASSWORD: $GRAFANA_ADMIN_PASSWORD"

# Apply with:
# kubectl apply -f infra/k8s/secrets-generator.yaml
# kubectl run secrets-generator --rm -i --restart=Never --image=python:3.11 -- bash -c "$(kubectl get configmap secrets-generator -n stt -o jsonpath='{.data.generate-secrets\.sh}')"
