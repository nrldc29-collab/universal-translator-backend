# PostgreSQL Deployment for STT Platform
# Deploys PostgreSQL with persistent storage for tenant data, API keys, usage counters, and audit logs

apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: stt
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: stt-platform-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stt-platform-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: stt
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: stt
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi

# Apply with:
# kubectl apply -f infra/k8s/postgres-deployment.yaml
