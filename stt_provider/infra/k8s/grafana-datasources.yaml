# Grafana Datasources Configuration
# Configures Prometheus as a datasource for Grafana

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: stt
data:
  datasources.yaml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: false

# Apply with:
# kubectl apply -f infra/k8s/grafana-datasources.yaml
