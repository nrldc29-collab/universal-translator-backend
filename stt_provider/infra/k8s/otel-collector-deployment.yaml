# OpenTelemetry Collector Deployment for STT Platform
# Deploys OpenTelemetry Collector for distributed tracing and metrics

apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.86.0
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
          args:
            - '--config=/etc/otel-collector/config.yaml'
          volumeMounts:
            - name: otel-collector-config
              mountPath: /etc/otel-collector
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: otel-collector-config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: stt
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: metrics
      port: 8888
      targetPort: 8888

# Apply with:
# kubectl apply -f infra/k8s/otel-collector-deployment.yaml
