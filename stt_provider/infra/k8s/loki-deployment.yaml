# Loki Deployment for STT Platform
# Deploys Loki for centralized log aggregation

apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.2
          ports:
            - name: loki
              containerPort: 3100
          args:
            - '-config.file=/etc/loki/local-config.yaml'
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
            - name: loki-data
              mountPath: /loki
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-data
          persistentVolumeClaim:
            claimName: loki-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: stt
spec:
  selector:
    app: loki
  ports:
    - name: loki
      port: 3100
      targetPort: 3100
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-pvc
  namespace: stt
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi

# Apply with:
# kubectl apply -f infra/k8s/loki-deployment.yaml
