# KEDA Installation for STT Platform
# Installs KEDA for Kubernetes Event-driven Autoscaling

apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: kedacore
  namespace: keda
spec:
  interval: 1h
  url: https://kedacore.github.io/charts

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: keda
spec:
  interval: 1h
  chart:
    spec:
      chart: keda
      version: '2.12.1'
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: keda
  values:
    metrics:
      apiServer:
        enabled: true

# Apply with:
# kubectl apply -f infra/k8s/keda-install.yaml
