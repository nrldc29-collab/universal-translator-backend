# Alertmanager Configuration for STT Platform
# Configures alert routing to PagerDuty, Opsgenie, or email

apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: stt
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    templates:
      - '/etc/alertmanager/templates/*.tmpl'

    route:
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'default'

      routes:
        # Critical alerts go to PagerDuty
        - match:
            severity: critical
          receiver: 'pagerduty'
          continue: false

        # Warning alerts go to email
        - match:
            severity: warning
          receiver: 'email'
          continue: false

    receivers:
      - name: 'default'
        email_configs:
          - to: 'alerts@example.com'
            from: 'alertmanager@example.com'
            smarthost: 'smtp.example.com:587'
            auth_username: 'alerts@example.com'
            auth_password: 'replace-me'

      - name: 'pagerduty'
        pagerduty_configs:
          - service_key: 'replace-me-pagerduty-key'
            description: '{{ .GroupLabels.alertname }}'

      - name: 'email'
        email_configs:
          - to: 'oncall@example.com'
            from: 'alertmanager@example.com'
            smarthost: 'smtp.example.com:587'
            auth_username: 'alerts@example.com'
            auth_password: 'replace-me'

    inhibit_rules:
      - source_match:
          severity: 'critical'
        target_match:
          severity: 'warning'
        equal: ['alertname', 'cluster', 'service']

# Apply with:
# kubectl apply -f infra/k8s/alertmanager-config.yaml
