# Kubernetes Deployment and Service for STT Gateway
# This file defines the FastAPI gateway deployment and service that sits in front
# of the Triton backend. It includes health checks, resource limits, and graceful
# connection draining support for rolling updates.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-gateway
  namespace: stt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stt-gateway
  template:
    metadata:
      labels:
        app: stt-gateway
    spec:
      # Long termination grace period allows WebSocket connections to drain gracefully
      terminationGracePeriodSeconds: 3600
      containers:
        - name: stt-gateway
          image: ghcr.io/your-org/true-streaming-stt-provider:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: stt-platform-secrets
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: stt-gateway
  namespace: stt
spec:
  selector:
    app: stt-gateway
  ports:
    - name: http
      port: 80
      targetPort: 8000

# Apply with:
# kubectl apply -f infra/k8s/gateway-deployment.yaml
