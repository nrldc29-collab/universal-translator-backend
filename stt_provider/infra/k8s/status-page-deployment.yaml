# Status Page Deployment for STT Platform
# Deploys a public status page for service availability monitoring

apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: stt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: status-page
  template:
    metadata:
      labels:
        app: status-page
    spec:
      containers:
        - name: status-page
          image: ghcr.io/your-org/stt-status-page:latest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROMETHEUS_URL
              value: "http://prometheus:9090"
            - name: GRAFANA_URL
              value: "http://grafana:3000"
            - name: INCIDENT_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: stt-platform-secrets
                  key: STATUS_PAGE_WEBHOOK_URL
            - name: PAGE_TITLE
              value: "STT Platform Status"
            - name: PAGE_DESCRIPTION
              value: "Real-time status of the True Streaming STT Platform"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: status-page
  namespace: stt
spec:
  selector:
    app: status-page
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: status-page-ingress
  namespace: stt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - status.example.com
      secretName: status-page-tls
  rules:
    - host: status.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: status-page
                port:
                  number: 80

# Apply with:
# kubectl apply -f infra/k8s/status-page-deployment.yaml
