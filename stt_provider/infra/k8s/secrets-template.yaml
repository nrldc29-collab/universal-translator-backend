# Kubernetes Secret template for STT Platform configuration
# This template contains all required environment variables for production deployment.
# Replace all "replace-me" values before applying.

apiVersion: v1
kind: Secret
metadata:
  name: stt-platform-secrets
  namespace: stt
type: Opaque
stringData:
  # Environment and authentication
  ENV: "production"
  STT_API_KEY: "replace-me"
  STT_API_KEYS: "browser:replace-me,cli:replace-me"
  ADMIN_API_KEY: "replace-me"
  STT_BACKEND: "triton"
  ALLOWED_ORIGINS: "https://your-domain.com,https://www.your-domain.com"

  # Database and cache connections
  POSTGRES_USER: "stt"
  POSTGRES_PASSWORD: "replace-me"
  DATABASE_URL: "postgresql://stt:replace-me@postgres.stt.svc.cluster.local:5432/stt"
  REDIS_URL: "redis://redis.stt.svc.cluster.local:6379/0"

  # Triton backend configuration
  TRITON_GRPC_URL: "triton-parakeet.stt.svc.cluster.local:8001"
  TRITON_ASR_MODEL: "parakeet-tdt-streaming"
  TRITON_DIARIZATION_MODEL: "diar_streaming_sortformer_4spk-v2"
  TRITON_REQUEST_TIMEOUT_MS: "5000"

  # Whisper fallback configuration
  WHISPER_MODEL_SIZE: "small"
  WHISPER_DEVICE: "cuda"
  WHISPER_COMPUTE_TYPE: "float16"
  TRANSCRIPTION_LANGUAGE: "en"
  SAMPLE_RATE: "16000"
  CHANNELS: "1"
  FRAME_MS: "30"
  VAD_MODE: "2"

  # Observability and security
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector.stt.svc.cluster.local:4317"
  API_KEY_HASH_SECRET: "replace-me"
  ENCRYPTION_KEY: "replace-me"

  # TLS requirements
  REQUIRE_TLS: "true"
  REQUIRE_MTLS: "false"

  # Rate limiting and session limits
  MAX_SESSION_SECONDS: "3600"
  IDLE_TIMEOUT_SECONDS: "60"
  MAX_AUDIO_FRAME_BYTES: "262144"
  MAX_ACTIVE_CONNECTIONS: "100"
  MAX_CONNECTIONS_PER_KEY: "10"
  MAX_CONCURRENT_STREAMS_PER_TENANT: "100"
  TRANSCRIPTION_RATE_LIMIT_PER_MINUTE: "30"
  ADMIN_RATE_LIMIT_PER_MINUTE: "5"

  # Billing
  BILLING_RATE_PER_AUDIO_HOUR: "0.0"
  ENABLE_ADMIN_RESET: "false"

  # Grafana credentials
  GRAFANA_ADMIN_USER: "admin"
  GRAFANA_ADMIN_PASSWORD: "replace-me"

  # PagerDuty integration
  PAGERDUTY_SERVICE_KEY: "replace-me"

# Apply only after replacing every replace-me value:
# kubectl apply -f infra/k8s/secrets-template.yaml
