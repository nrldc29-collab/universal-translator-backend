# Python project configuration for True Streaming STT Provider
# This file defines the package metadata, dependencies, and tool configurations
# for the self-hosted streaming speech-to-text service.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "true-streaming-stt-provider"
version = "0.1.0"
description = "Self-hosted streaming and batch speech-to-text service built on FastAPI and faster-whisper."
readme = { text = "Self-hosted streaming and batch speech-to-text service built on FastAPI and faster-whisper.", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [
    { name = "True Streaming STT Provider maintainers" },
]
keywords = ["speech-to-text", "stt", "whisper", "faster-whisper", "fastapi", "websocket", "streaming"]
classifiers = [
    "Framework :: FastAPI",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Runtime dependencies inferred from the imports in stt_server/*.
dependencies = [
    "fastapi>=0.110",                   # Web framework
    "uvicorn[standard]>=0.27",         # ASGI server
    "pydantic>=2.5",                   # Data validation
    "pydantic-settings>=2.1",          # Settings management
    "python-multipart>=0.0.9",         # Required by FastAPI for UploadFile / Form
    "faster-whisper>=1.0.0",           # Whisper speech recognition
    "webrtcvad>=2.0.10",               # Voice activity detection
    "slowapi>=0.1.9",                  # Rate limiting
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",                     # Testing framework
    "pytest-asyncio>=0.23",            # Async test support
    "httpx>=0.27",                     # For FastAPI TestClient and async client tests
    "ruff>=0.4",                       # Linter
    "mypy>=1.10",                      # Type checker
]
cuda = [
    # Install the matching CUDA-enabled CTranslate2 wheel separately for your platform.
    # faster-whisper picks it up automatically when WHISPER_DEVICE=cuda.
]

# No console_scripts entry yet. Run the server with:
#   uvicorn stt_server.main:app --host 0.0.0.0 --port 8000
# To add a real CLI later, create stt_server/cli.py with a main() function
# and uncomment:
#   [project.scripts]
#   stt-server = "stt_server.cli:main"

[project.urls]
"Source" = "https://example.invalid/true-streaming-stt-provider"
"Issues" = "https://example.invalid/true-streaming-stt-provider/issues"

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["stt_server*"]
exclude = ["tests*", ".venv*", "logs*"]

# Ruff configuration for linting
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL", "RUF"]
ignore = [
    "B008",      # FastAPI intentionally uses dependency calls in defaults
    "PLR0912",   # WebSocket route currently owns the full session state machine
    "PLR0913",   # FastAPI handlers naturally have many params
    "PLR0915",   # WebSocket route currently owns the full session state machine
    "PLW0603",   # Active connection gauges are module-level process state
]

# Pytest configuration for testing
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:fastapi.routing",
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:slowapi.extension",
    "ignore:'asyncio.iscoroutinefunction' is deprecated.*:DeprecationWarning:starlette._utils",
]
