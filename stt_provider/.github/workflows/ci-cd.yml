# CI/CD Pipeline for STT Platform
# Builds, tests, and deploys the STT Platform to production

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build and test job
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd server
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff mypy
      
      - name: Run linting
        run: |
          cd server
          ruff check stt_server
          mypy stt_server
      
      - name: Run tests
        run: |
          cd server
          pytest tests/ -v --cov=stt_server --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./server/coverage.xml

  # Build Docker image
  build-image:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to staging
  deploy-staging:
    needs: build-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment:
      name: staging
      url: https://staging.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}
      
      - name: Update deployment image
        run: |
          kubectl set image deployment/stt-gateway \
            stt-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n stt-staging
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/stt-gateway -n stt-staging --timeout=10m
      
      - name: Run smoke tests
        run: |
          python scripts/staging_smoke_test.sh
      
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/stt-gateway -n stt-staging

  # Deploy to production
  deploy-production:
    needs: build-image
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://stt.example.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.PRODUCTION_KUBECONFIG }}
      
      - name: Create backup before deployment
        run: |
          kubectl exec -n stt postgres-0 -- pg_dump -U stt -d stt > /tmp/pre-deploy-backup.sql
          aws s3 cp /tmp/pre-deploy-backup.sql s3://your-backup-bucket/stt/postgres/pre-deploy-$(date +%Y%m%d_%H%M%S).sql
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      
      - name: Update deployment image
        run: |
          kubectl set image deployment/stt-gateway \
            stt-gateway=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n stt
      
      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/stt-gateway -n stt --timeout=15m
      
      - name: Run production smoke tests
        run: |
          python scripts/production_smoke_test.sh
        env:
          PRODUCTION_STT_API_KEY: ${{ secrets.PRODUCTION_STT_API_KEY }}
      
      - name: Verify health endpoints
        run: |
          kubectl run health-check --rm -i --restart=Never --image=curlimages/curl:latest \
            -- curl -f https://stt.example.com/health
      
      - name: Rollback on failure
        if: failure()
        run: |
          kubectl rollout undo deployment/stt-gateway -n stt
          echo "Deployment failed, rolled back to previous version"
          exit 1

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    needs: build-image
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
      
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

  # Performance testing
  performance-test:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/develop'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.STAGING_KUBECONFIG }}
      
      - name: Run load test
        run: |
          python server/scripts/load_test_ws.py \
            --url wss://staging.example.com/stt/stream \
            --clients 10 \
            --seconds 60
      
      - name: Check performance metrics
        run: |
          # Query Prometheus for performance metrics
          curl -s "https://prometheus.staging.example.com/api/v1/query?query=rate(stt_audio_bytes_received_total[5m])"
