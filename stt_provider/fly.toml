# Fly.io deployment configuration for True Streaming STT Provider
# This file configures the application deployment on Fly.io including build settings,
# environment variables, HTTP service configuration, VM resources, and volume mounts.

app = "true-streaming-stt-provider"
primary_region = "iad"

[build]
  dockerfile = "server/Dockerfile"

[env]
  # Whisper model configuration
  WHISPER_MODEL_SIZE = "base"
  WHISPER_DEVICE = "cpu"
  WHISPER_COMPUTE_TYPE = "int8"
  TRANSCRIPTION_LANGUAGE = "en"
  # Audio processing parameters
  SAMPLE_RATE = "16000"
  CHANNELS = "1"
  FRAME_MS = "30"
  VAD_MODE = "2"
  # Connection and session limits
  MAX_ACTIVE_CONNECTIONS = "10"
  MAX_CONNECTIONS_PER_KEY = "3"
  MAX_SESSION_SECONDS = "1800"
  IDLE_TIMEOUT_SECONDS = "60"
  MAX_AUDIO_FRAME_BYTES = "262144"
  # Billing and admin settings
  BILLING_RATE_PER_AUDIO_HOUR = "0.0"
  ENABLE_ADMIN_RESET = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "4096mb"

[[mounts]]
  source = "stt_data"
  destination = "/app/logs"
